[project]
name = "slate-detector"
version = "0.1.0"
description = "Binary classifier: is a FishSense dive slate anywhere in this frame?"
readme = "README.md"
authors = [
    { name = "Christopher L. Crutchfield", email = "ccrutchf@ucsd.edu" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2",
    "pillow>=10",
    "rawpy>=0.27",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "scikit-learn>=1.5",
]
render = [
    "fishsense-core==4.1.0",  # cp313 wheel only (see tool.uv.sources)
    "opencv-python-headless>=4.10",
]
masks = [
    "opencv-python-headless>=4.10",
    "pymupdf>=1.24",
]
sam = [
    "ultralytics>=8.3",
]

# SAM 3.1 text-prompted masks, pinned to the commit fishsense-lite and fishsense-detector use.
sam3 = [
    "torch>=2.4",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@8e451d5eb43c817b64ae7577fb7b9ae223db88a9",
    "fishsense-core==4.1.0",
    "einops>=0.8.0",
    "psutil>=6.0.0",
    "setuptools>=80.9.0,<82",  # sam3 imports pkg_resources, removed in 82
    "pycocotools>=2.0.8",  # imported by sam3 but not declared
]
ls = [
    "boto3>=1.34",
    "label-studio-sdk>=2.0.1",
]

[project.scripts]
slate-detector = "slate_detector.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the restored DB container and the NAS",
]
addopts = "-m 'not data'"

[tool.uv]
# ultralytics asks for the GUI build of OpenCV, which needs X11 libraries;
# opencv-python-headless provides the same cv2 (same fix as fishsense-detector).
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "numpy>=2",  # sam3 pins numpy<2; the rest of the stack needs numpy 2 (as in fishsense-detector)
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
fishsense-core = { url = "https://github.com/UCSD-E4E/fishsense-core/releases/download/fishsense-core-v4.1.0/fishsense_core-4.1.0-cp313-cp313-manylinux_2_34_x86_64.whl" }

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
